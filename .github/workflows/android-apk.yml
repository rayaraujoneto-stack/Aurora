name: Compilar Aurora Stream APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Aurora_Stream_Android_2.0_Fonte/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android:
    name: Gerar APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aurora_Stream_Android_2.0_Fonte
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK de teste
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraStream-2.0-APK-debug
          path: Aurora_Stream_Android_2.0_Fonte/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
