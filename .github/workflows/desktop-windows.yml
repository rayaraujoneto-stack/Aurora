name: Compilar Aurora Stream Desktop para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Aurora_Stream_Desktop_3.0_Windows.zip'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Extrair projeto desktop
        shell: pwsh
        run: Expand-Archive -LiteralPath "Aurora_Stream_Desktop_3.0_Windows.zip" -DestinationPath "."

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        working-directory: Aurora_Stream_Desktop_3.0
        run: npm install --no-audit --no-fund

      - name: Verificar JavaScript
        working-directory: Aurora_Stream_Desktop_3.0
        run: |
          node --check app.js
          node --check desktop/main.cjs
          node --check desktop/preload.cjs

      - name: Gerar instalador e versão portátil
        working-directory: Aurora_Stream_Desktop_3.0
        run: npm run dist:win

      - name: Publicar executáveis
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Stream-Desktop-3.0-Windows
          path: |
            Aurora_Stream_Desktop_3.0/dist/*.exe
            Aurora_Stream_Desktop_3.0/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
